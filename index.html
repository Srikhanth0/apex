<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apex — AI engineer coach</title>
  <meta name="description" content="Personal coaching tracker with a daily AI reading briefing and job matching: session, streak, DSA, PRs, articles, jobs.">
  <meta name="theme-color" content="#f4f6f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0e0e" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <aside class="side" aria-label="Main">
      <a class="brand" href="#today" aria-label="Apex home">
        <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3" y="14" width="4.5" height="7" rx="1.5" opacity=".45"/><rect x="9.75" y="9" width="4.5" height="12" rx="1.5" opacity=".7"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg>
        <span><b>Apex</b><small id="who">90-day coach</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><button class="btn sm" id="themeBtn" data-act="theme">Theme: System</button><div class="sync" id="syncState">Local only</div></div>
    </aside>
    <header class="top">
      <a class="brand" href="#today" aria-label="Apex home">
        <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="14" width="4.5" height="7" rx="1.5" opacity=".45"/><rect x="9.75" y="9" width="4.5" height="12" rx="1.5" opacity=".7"/><rect x="16.5" y="3" width="4.5" height="18" rx="1.5"/></svg>
        <b id="topTitle">Today</b>
      </a>
      <a class="icon-btn" href="#settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </header>
    <main class="sheet" id="view" tabindex="-1">
      <noscript><p class="pad">Apex needs JavaScript to run.</p></noscript>
    </main>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
